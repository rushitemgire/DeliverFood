<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form using HTML</title>
  </head>
  <body>
    <h2 align="center">Student Registration Form</h2>

    <form align="center" method="post">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter Your Name" required/><br /><br />
      <label for="uname">Username:</label>
      <input type="text" id="uname" placeholder="Enter Your Username" required/><br /><br />
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter Your Email" required/><br /><br />
      <label for="pass">Password:</label>
      <input type="password" id="pass" placeholder="Enter Your Password" required/><br /><br />
      <label for="confirm">Confirm Password:</label>
      <input type="password" id="confirm" placeholder="Confirm Password" required/><br /><br />
      <button type="submit">Register</button>
    </form>
  </body>
</html>
